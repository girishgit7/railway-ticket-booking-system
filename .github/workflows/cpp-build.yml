name: Railway C++ Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "sprint/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile Sprint 2 with warnings as errors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic railway_sprint2.cpp -o railway_sprint2

      - name: Verify executable
        run: test -x railway_sprint2

      - name: Smoke test guest menu and clean exit
        run: |
          printf '0\\n' | ./railway_sprint2
