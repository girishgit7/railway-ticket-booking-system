name: Railway C++ Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: railway-cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Sprint 2
        run: g++ -std=c++17 -Wall -Wextra -pedantic railway_sprint2.cpp -o railway_sprint2

      - name: Verify executable
        run: test -x railway_sprint2

      - name: Smoke test guest menu and clean exit
        run: |
          printf '0\n' | ./railway_sprint2
